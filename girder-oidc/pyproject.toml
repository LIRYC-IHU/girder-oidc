[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "girder-oidc"
version = "0.4.0"
description = "Authenticate Girder users through an OpenID Connect provider."
readme = "README.md"
license = {text = "Apache 2.0"}
authors = [
    {name = "Josselin Duchateau"},
]
keywords = ["girder", "oidc", "openid connect", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
dependencies = [
    "girder>=5",
    # Pinned: ID-token validation relies on authlib rejecting `alg: none` and
    # refusing to import an RSA JWK as an HMAC key. Both are properties of the
    # 1.x `authlib.jose` API, which 2.0 replaces with joserfc.
    "authlib>=1.3,<2",
    "requests",
]

[project.entry-points."girder.plugin"]
oidc = "girder_oidc:OidcPlugin"

[project.urls]
Homepage = "https://github.com/LIRYC-IHU/girder-oidc"

[tool.setuptools.packages.find]
exclude = ["plugin_tests*"]

[tool.setuptools.package-data]
girder_oidc = [
    "web_client/dist/girder-plugin-oidc.umd.cjs",
    "web_client/dist/style.css",
]
