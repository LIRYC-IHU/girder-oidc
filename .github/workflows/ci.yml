name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of `requires-python`, so a change that only works on
        # one of the two fails here rather than at a user's install.
        python-version: ['3.10', '3.13']
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install girder and the plugin
        # pytest-girder brings the server/db fixtures the suite runs on. The web
        # client is not built here: conftest.py writes placeholder dist files,
        # which is all the plugin's static-content registration needs.
        run: |
          python -m pip install --upgrade pip
          pip install "girder>=5" "authlib>=1.3,<2" pytest pytest-girder
          pip install -e ./girder-oidc

      - name: Run the plugin test suite
        # A real mongod, not --mock-db: mongomock does not implement the
        # tz-aware codec options girder 5 uses.
        working-directory: girder-oidc
        run: pytest -q plugin_tests --mongo-uri mongodb://localhost:27017

  build:
    name: Build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: girder-oidc/girder_oidc/web_client/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the web client
        # The wheel ships the built bundle as package data (girder 5 serves it
        # straight from the installed package), so this has to run first.
        working-directory: girder-oidc/girder_oidc/web_client
        run: |
          npm ci
          npm run build

      - name: Build the distributions
        working-directory: girder-oidc
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Check the bundle made it into the wheel
        # A wheel that builds but ships no web client installs cleanly and then
        # fails at plugin load, so fail here instead.
        working-directory: girder-oidc
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          names = zipfile.ZipFile(wheel).namelist()
          for expected in ('girder_oidc/web_client/dist/girder-plugin-oidc.umd.cjs',
                           'girder_oidc/web_client/dist/style.css'):
              assert expected in names, f'{expected} missing from {wheel.name}'
          print(f'{wheel.name}: web client bundled')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: girder-oidc/dist/*
          if-no-files-found: error
