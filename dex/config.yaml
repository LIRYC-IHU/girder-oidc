# Dex configuration for the girder-oidc dev stack.
#
# Dex is a lightweight OpenID Connect provider used here in place of a full
# Keycloak install. It is reachable at two URLs:
#   - http://localhost:5556/dex  from the host browser  (== issuer)
#   - http://dex:5556/dex        from the girder container (server-to-server)
# The issuer below is the browser-facing URL; the plugin rewrites it to the
# internal URL for its own server-side discovery / token / JWKS calls.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  # Don't show the consent screen in dev; just bounce straight back.
  skipApprovalScreen: true

# Allow username/password login from the static list below.
enablePasswordDB: true

staticClients:
  - id: girder
    name: Girder
    secret: girder-dev-secret
    redirectURIs:
      - http://localhost:8080/api/v1/oidc/callback

staticPasswords:
  # Password is "testpass123" (bcrypt hash below).
  - email: testuser@example.com
    hash: "$2b$10$zgznMrl9CH4E9n2URr4TruFGqj0qpXsIdMApTdg/LMJuzCj.HPfKa"
    username: testuser
